name: Build Shield Post-Process Cel Build 6 No Fog Baseline

on:
  push:
    branches:
      - android11-shield-postprocess-cel-build6-no-fog-baseline
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;4.1.2" "ndk;28.2.13676358"

      - name: Install FFmpeg Prefab dependency
        run: |
          mkdir -p "$HOME/.m2/repository"
          curl -fL --retry 3 -o /tmp/ffmpeg-prefab.tar.xz "https://github.com/leleliu008/ndk-pkg-prefab-aar-maven-repo/releases/download/2023.08.14.00.12/2023.08.14.00.12-com-fpliu-ndk-pkg-prefab-android-21-ffmpeg-6.0.tar.xz"
          tar -xJf /tmp/ffmpeg-prefab.tar.xz --strip-components=1 -C "$HOME/.m2/repository"

      - name: Build release APK
        working-directory: android-project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        working-directory: android-project
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androidrelease \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Simpsons Hit and Run Android, OU=Build, O=Community, C=US"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk \
            "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          rm -f "$APK"

      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-Hit-and-Run-Shield-Post-Process-Cel-Build-6-No-Fog-Baseline
          path: android-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

# Baseline source: build #6 at 91bdbb6542b6232709d73348989e7f1522d8fcee.
# Changes: remove only the custom fog tint; bloom strength 1.15 -> 1.30; sunlight glare 0.08 -> 0.10.
# All existing outline, depth fade, smoothing, and colour-grade settings are retained.
